<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/skills/browser-explain/assets/explain.css?v=20261120">
<title>작업 보드</title>
<style>
  /* 색, 글자 크기, 그림자는 explain.css의 이름만 부른다(값의 원본은 DESIGN.md) */
  .sheet { max-width: 1400px; margin: 0 auto; padding: 48px 32px; }
  .sheet > header { margin-bottom: 32px; }
  .project { margin: 0; font-size: var(--fs-s); color: var(--muted); }
  h1 { margin-bottom: 8px; }
  /* 다른 창의 iframe(허브 본문) 안에서는 허브 윗줄이 이미 "<프로젝트> / 작업 보드"를 말한다 */
  .embedded .project, .embedded h1 { display: none; }
  .purpose { margin: 0 0 8px; }
  .purpose.clickable { text-decoration: underline; text-decoration-color: var(--strong); text-underline-offset: 4px; }
  .note { margin: 0; font-size: var(--fs-s); color: var(--muted); }
  .clickable { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; color: inherit; }
  .error { white-space: pre-wrap; padding: 12px 16px; background: var(--note); color: var(--note-ink); border: 1px solid var(--note-line); border-radius: 8px; }

  /* 상태 칸반: 넓은 화면은 네 열, 폭 720px 미만은 탭이 고른 열 하나 */
  .kanban { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px; }
  .state-col { min-width: 0; }
  .state-head { margin: 0 0 12px; padding: 0 0 8px; font-size: var(--fs-t); line-height: 1.3; letter-spacing: 0; border-bottom: 1px solid var(--strong); }
  .n { font-variant-numeric: tabular-nums; font-weight: 400; color: var(--muted); }
  .cards { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; max-width: none; }
  .task-card { display: block; width: 100%; min-height: 44px; padding: 8px 12px; text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; overflow-wrap: anywhere; }
  .task-card:hover { background: var(--alt); }
  .tabs { display: none; }

  /* 대화상자: 허브 서랍과 같은 떠 있는 면 */
  dialog { width: min(640px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); padding: 24px; border: 0; border-radius: 8px; background: var(--raised); color: var(--ink); box-shadow: var(--shadow); font-size: var(--fs-t); line-height: 1.6; }
  dialog::backdrop { background: var(--scrim); }
  dialog h3 { margin: 0 0 4px; }
  dialog .doc h3 { margin: 24px 0 8px; }
  dialog h4.md { margin: 24px 0 8px; font-size: var(--fs-t); font-weight: 600; color: var(--ink); }
  dialog .doc > :first-child { margin-top: 0; }
  dialog p { margin: 0 0 12px; max-width: none; }
  dialog ul, dialog ol { margin: 0 0 12px; padding-left: 24px; max-width: none; }
  dialog .kind { margin: 0 0 16px; font-size: var(--fs-s); color: var(--muted); }
  dialog h4 { margin: 16px 0 4px; font-size: var(--fs-s); font-weight: 600; color: var(--muted); }
  dialog pre { margin: 0 0 12px; padding: 12px 16px; background: var(--alt); border: 1px solid var(--rule); border-radius: 8px; font-size: var(--fs-s); white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog pre code { padding: 0; background: none; }
  dialog .close { min-height: 44px; margin-top: 16px; padding: 0 16px; font-weight: 600; background: none; border: 1px solid var(--strong); border-radius: 8px; cursor: pointer; }

  @media (max-width: 719.98px) {
    .sheet { padding: 24px 16px 48px; }
    .sheet > header { margin-bottom: 24px; }
    .tabs { display: flex; margin-bottom: 16px; border-bottom: 1px solid var(--rule); overflow-x: auto; }
    .tab { flex: 1 0 auto; min-height: 44px; padding: 0 8px; font-weight: 600; text-align: center; white-space: nowrap; color: var(--muted); background: none; border: 0; cursor: pointer; }
    .tab[aria-selected="true"] { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
    .kanban { display: block; }
    .state-col:not(.is-selected), .state-head { display: none; }
  }

  /* 옛 에픽 보드: 동사마다 한 열. 에픽마다 "목적 띠" 한 행과 "칸" 한 행을 쓴다. 행 높이는 모든 열이 함께 쓴다. */
  .map { display: grid; grid-template-columns: repeat(var(--verbs), minmax(0, 1fr)); column-gap: 32px; }
  .col { display: grid; grid-row: 1 / span var(--tracks); grid-template-rows: subgrid; }
  /* 약속: 동사가 아니라 앱이 항상 지키는 것. 맨 오른쪽에 두고 세로 선으로 동사와 가른다. */
  .col.promise { position: relative; }
  .col.promise::before { content: ""; position: absolute; top: 0; bottom: 0; left: -16px; border-left: 1px solid var(--rule); }
  .col.promise .vhead { color: var(--muted); }
  .vhead { margin: 0; padding: 0 0 12px; font-size: 20px; line-height: 1.3; letter-spacing: 0; border-bottom: 1px solid var(--strong); }
  .band { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 16px; padding: 32px 0 4px; }
  .band .row-name { flex: none; font-size: 20px; font-weight: 600; }
  .band .goal { margin: 0; color: var(--muted); }
  .cell { padding: 8px 0 24px; }
  .item { display: flex; align-items: baseline; gap: 8px; min-height: 48px; padding: 12px 4px 8px; border-bottom: 1px solid var(--rule); }
  .item.empty { border-bottom-color: transparent; }
  .item .name { position: relative; }
  .item.done::after { content: "✓"; }
  .item.now .name::before {
    content: ""; position: absolute; inset: -8px -12px -4px -12px;
    border: 2px solid var(--accent); border-radius: 50%; transform: rotate(-2deg);
  }
  .item.now::after { content: "지금 하는 곳"; font-size: var(--fs-s); font-weight: 600; color: var(--accent); margin-left: 16px; }
  .row-tag { display: none; }
  .item.clickable .name, .vhead.clickable, .row-name.clickable { text-decoration: underline; text-decoration-color: var(--strong); text-underline-offset: 4px; }

  @media (max-width: 899px) {
    .map { display: block; }
    .band { display: block; padding: 0 0 16px; }
    .band.no-goal { display: none; }
    .band .row-name { font-size: var(--fs-t); margin-right: 8px; }
    .band .goal { display: inline; }
    .col { display: block; margin: 0 0 32px; }
    .col:first-of-type { margin-top: 16px; }
    .col.promise::before { display: none; }
    .col.promise { padding-top: 24px; border-top: 1px solid var(--rule); }
    .spacer { display: none; }
    .vhead { padding-bottom: 8px; }
    .cell { display: flex; gap: 16px; padding: 8px 0 0; }
    .cell.blank { display: none; }
    .row-tag { display: block; flex: none; width: 3.2em; padding-top: 12px; font-size: var(--fs-s); font-weight: 600; color: var(--muted); }
    .cell .items { flex: 1; min-width: 0; }
  }
</style>
</head>
<body>
<main class="sheet">
  <header>
    <p class="project" id="project"></p>
    <h1>작업 보드</h1>
    <p class="purpose" id="purpose"></p>
    <p class="note" id="note" hidden>완료는 당시 합의한 작업 결과의 확인이며 현재 제품 기능을 보장하지 않습니다.</p>
  </header>
  <div class="tabs" id="tabs" role="tablist" aria-label="작업 상태"></div>
  <div class="map" id="map"></div>
  <dialog id="info"></dialog>
</main>

<script type="module">
// 보드 내용은 data/story-map/<프로젝트 이름>/board.json 에 있다. 주소의 ?p= 로 프로젝트를 고른다.
const projectId = new URLSearchParams(location.search).get("p");
// 산출물은 hstack 저장소의 data/story-map/<프로젝트 이름>/ 에 있다. 이 틀은 skills/story-map/board/ 에 있으므로 세 단계 위가 저장소 루트다.
const DATA = `../../../data/story-map/${encodeURIComponent(projectId ?? "")}`;
const sheet = document.querySelector(".sheet");
if (window.parent !== window) sheet.classList.add("embedded");
let board;

// 옛 에픽 보드에서 동사나 칸을 누르면 뜨는 정보 창.
// 동사: about(무엇을 하는 단계인가), log
// 칸: what(할 수 있게 되는 것), screen(화면 디자인 필요/불필요/애매), decided(정한 것), comps(시안 경로), undecided(정하지 않은 것), log
// 에픽: goal(목적), check(끝났다고 보는 조건), state, log
// log: [{ date, text }] 생긴 맥락부터 바뀔 때마다 한 줄씩
const info = document.getElementById("info");
function hasInfo(it) {
  return ["about", "what", "goal", "check", "log", "screen", "decided", "comps", "undecided"].some((k) => it[k] && it[k].length);
}
function openInfo(it, kind) {
  beginDialog();
  info.append(el("h3", "", it.name), el("p", "kind", kind));
  const text = (title, value) => { if (value) info.append(el("h4", "", title), el("p", "", value)); };
  const list = (title, values, link) => {
    if (!values || !values.length) return;
    info.append(el("h4", "", title));
    const ul = el("ul");
    values.forEach((v) => {
      const li = el("li");
      if (link) {
        const a = el("a", "", v.split("/").pop());
        a.href = `${DATA}/${v}`;
        a.target = "_blank";
        li.append(a);
      } else li.textContent = v;
      ul.append(li);
    });
    info.append(ul);
  };
  text("무엇을 하나", it.about || it.what);
  text("목적", it.goal);
  if (it.state && it.goal) text("상태", it.state);
  list("끝났다고 보는 조건", it.check);
  text("화면 디자인", it.screen);
  list("정한 것", it.decided);
  list("시안", it.comps, true);
  list("정하지 않은 것", it.undecided);
  list("기록", (it.log || []).map((e) => (e.date ? e.date + " " : "") + e.text));
  showDialog(it.name);
}
let documentRequest = 0;
function beginDialog() {
  documentRequest += 1;
  info.replaceChildren();
}
function showDialog(label) {
  info.setAttribute("aria-label", label);
  const close = el("button", "close", "닫기");
  close.type = "button";
  close.addEventListener("click", () => info.close());
  info.append(close);
  if (!info.open) info.showModal();
  info.scrollTop = 0;
  close.focus({ preventScroll: true });
}
info.addEventListener("close", () => { documentRequest += 1; });
info.addEventListener("click", (e) => { if (e.target === info) info.close(); });
function interactive(node, action) {
  node.classList.add("clickable");
  node.tabIndex = 0;
  node.setAttribute("role", "button");
  node.addEventListener("click", action);
  node.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") { event.preventDefault(); action(); }
  });
}

// 제품 문서: data/story-map/<이름>/product.md. 머리말의 summary를 제목 아래에 보이고, 누르면 본문을 대화상자로 연다.
async function loadProduct() {
  const res = await fetch(`${DATA}/product.md`, { cache: "no-store" });
  if (!res.ok) return;
  const text = await res.text();
  const m = text.match(/^---\n([\s\S]*?)\n---\n?/);
  const body = m ? text.slice(m[0].length) : text;
  const summary = m && (m[1].match(/^summary:\s*"?(.*?)"?\s*$/m) || [])[1];
  const purpose = document.getElementById("purpose");
  purpose.textContent = summary || "제품 문서";
  interactive(purpose, () => {
    beginDialog();
    const doc = el("div", "doc");
    doc.append(...renderMarkdown(body, new URL(`${DATA}/product.md`, location.href)));
    info.append(doc);
    showDialog("제품 문서");
  });
}

// 제품 문서와 작업 문서에 쓰는 만큼만 그리는 작은 마크다운 그리기: 제목, 문단, 목록, 굵게, 코드
function safeLink(value, base) {
  try {
    const url = new URL(value, base);
    return ["http:", "https:"].includes(url.protocol) ? url.href : null;
  } catch { return null; }
}
function renderMarkdown(md, base = location.href) {
  const inline = (t) => {
    const span = el("span");
    t.split(/(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^\s)]+\))/).forEach((part) => {
      if (part.startsWith("**") && part.endsWith("**")) span.append(el("b", "", part.slice(2, -2)));
      else if (part.startsWith("`") && part.endsWith("`")) span.append(el("code", "", part.slice(1, -1)));
      else {
        const link = part.match(/^\[([^\]]+)\]\(([^\s)]+)\)$/);
        const href = link && safeLink(link[2], base);
        if (href) {
          const a = el("a", "", link[1]);
          a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
          span.append(a);
        } else span.append(document.createTextNode(part));
      }
    });
    return span;
  };
  const out = [];
  let list = null;
  let code = null;
  md.split("\n").forEach((line) => {
    const t = line.trim();
    if (t.startsWith("```")) {
      list = null;
      if (code) code = null;
      else { const pre = el("pre"); code = el("code"); pre.append(code); out.push(pre); }
      return;
    }
    if (code) { code.append(document.createTextNode(line + "\n")); return; }
    const bullet = t.match(/^[-*]\s+(.*)$/);
    const num = t.match(/^\d+\.\s+(.*)$/);
    if (bullet || num) {
      const tag = bullet ? "ul" : "ol";
      if (!list || list.tagName.toLowerCase() !== tag) { list = el(tag); out.push(list); }
      const li = el("li"); li.append(inline((bullet || num)[1])); list.append(li);
      return;
    }
    list = null;
    if (!t) return;
    const heading = t.match(/^(#{1,6})\s+(.*)$/);
    if (heading) { const h = heading[1].length === 1 ? el("h3") : el("h4", "md"); h.append(inline(heading[2])); out.push(h); }
    else { const p = el("p"); p.append(inline(t)); out.push(p); }
  });
  return out;
}

const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
};

const map = document.getElementById("map");
function renderLegacy() {
map.style.setProperty("--verbs", board.verbs.length);
map.style.setProperty("--tracks", 1 + board.rows.length * 2);

// 목적 띠: 에픽마다 전체 폭으로 한 줄. 격자의 2, 4, 6 … 번째 행에 놓인다.
board.rows.forEach((row, i) => {
  const band = el("div", "band" + (row.goal ? "" : " no-goal"));
  band.style.gridRow = String(2 + i * 2);
  const rowName = el("span", "row-name", row.name);
  if (hasInfo(row)) {
    interactive(rowName, () => openInfo(row, "에픽"));
  }
  band.append(rowName);
  if (row.goal) band.append(el("p", "goal", row.goal));
  map.append(band);
});

board.verbs.forEach((verb, v) => {
  const promise = verb.kind === "promise";
  const col = el("section", "col" + (promise ? " promise" : ""));
  col.style.gridColumn = String(v + 1);
  const head = el("h2", "vhead", verb.name);
  if (hasInfo(verb)) {
    interactive(head, () => openInfo(verb, promise ? "약속" : "동사"));
  }
  col.append(head);
  board.rows.forEach((row, i) => {
    col.append(el("div", "spacer"));
    const items = verb.cells[i] ?? [];
    const cell = el("div", "cell" + (items.length ? "" : " blank"));
    cell.append(el("span", "row-tag", row.name));
    const list = el("div", "items");
    if (!items.length) list.append(el("div", "item empty"));
    items.forEach((it) => {
      const item = el("div", "item" + (it.state ? " " + it.state : ""));
      item.append(el("span", "name", it.name));
      list.append(item);
      if (hasInfo(it)) {
        interactive(item, () => openInfo(it, `칸 · ${verb.name} · ${row.name}`));
      }
    });
    cell.append(list);
    col.append(cell);
  });
  map.append(col);
});
}

const states = [["todo", "후보"], ["doing", "진행 중"], ["done", "완료"], ["cancelled", "취소"]];
function taskPath(value) {
  if (typeof value !== "string" || !value) throw new Error("작업 경로가 없습니다.");
  let decoded;
  try { decoded = decodeURIComponent(value); } catch { throw new Error(`잘못된 작업 경로: ${value}`); }
  if (/[\\:%?#\u0000-\u001f\u007f]/.test(decoded) || decoded.startsWith("/") ||
      decoded.split("/").some((part) => !part || part === "." || part === "..") || !/\.md$/i.test(decoded)) {
    throw new Error(`프로젝트 안의 상대 Markdown 경로가 아닙니다: ${value}`);
  }
  return decoded;
}
// 새 형식은 verbs와 tasks[].verb를 읽지 않는다. 남아 있어도 무시한다.
function validateBoard(value) {
  const isObject = value && typeof value === "object" && !Array.isArray(value);
  if (isObject && value.format === "task-board") {
    if (!Array.isArray(value.tasks)) throw new Error("작업 보드에 tasks 배열이 필요합니다.");
    const paths = new Set();
    value.tasks.forEach((task) => {
      if (!task || typeof task.name !== "string" || !task.name.trim()) throw new Error("작업 이름이 없습니다.");
      const path = taskPath(task.path);
      if (paths.has(path)) throw new Error(`중복 작업 경로: ${task.path}`);
      paths.add(path);
      if (!states.some(([state]) => state === task.state)) throw new Error(`잘못된 작업 상태: ${task.name} (${task.state})`);
    });
    return;
  }
  if (!isObject || !Array.isArray(value.verbs)) throw new Error("board.json에 verbs 배열이 필요합니다.");
  if (!Array.isArray(value.rows)) throw new Error("알 수 없는 보드 형식이거나 rows 배열이 없습니다.");
  value.verbs.forEach((verb) => { if (!verb || !Array.isArray(verb.cells)) throw new Error("기존 보드의 cells 배열을 읽을 수 없습니다."); });
}
async function openTask(task) {
  beginDialog();
  const request = documentRequest;
  const body = el("div", "doc");
  body.append(el("p", "", "작업 문서를 읽는 중입니다."));
  info.append(el("h3", "", task.name), body);
  showDialog(task.name);
  const path = taskPath(task.path).split("/").map(encodeURIComponent).join("/");
  const url = new URL(`${DATA}/${path}`, location.href);
  try {
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const text = await response.text();
    if (request !== documentRequest || !info.open) return;
    const nodes = renderMarkdown(text, url);
    // 문서의 첫 제목이 카드 이름과 같으면 대화상자 제목만 남긴다
    const first = nodes[0];
    if (first && first.tagName === "H3" && first.textContent.trim() === task.name.trim()) nodes.shift();
    body.replaceChildren(...nodes);
  } catch (error) {
    if (request !== documentRequest || !info.open) return;
    body.replaceChildren(el("p", "error", `작업 문서를 읽지 못했습니다. ${task.path} (${error.message})`));
  }
}

// 상태 칸반: 열 네 개가 항상 DOM에 있고, 좁은 화면(폭 720px 미만)에서는 CSS가 고른 열만 보인다.
// 고른 탭은 화면 안의 상태이며 저장하지 않는다.
function renderTasks() {
  document.getElementById("note").hidden = false;
  map.className = "kanban";
  const tablist = document.getElementById("tabs");
  const narrow = matchMedia("(max-width: 719.98px)");
  const parts = states.map(([state, name]) => {
    const count = board.tasks.filter((task) => task.state === state).length;
    const label = (node) => { node.append(`${name} `, el("span", "n", String(count))); return node; };
    const tab = label(el("button", "tab"));
    tab.type = "button"; tab.id = `tab-${state}`;
    tab.setAttribute("role", "tab"); tab.setAttribute("aria-controls", `panel-${state}`);
    const panel = el("section", "state-col");
    panel.id = `panel-${state}`;
    const head = label(el("h2", "state-head")); head.id = `head-${state}`;
    const cards = el("ul", "cards");
    board.tasks.filter((task) => task.state === state).forEach((task) => {
      const card = el("button", "task-card", task.name);
      card.type = "button";
      card.addEventListener("click", () => openTask(task));
      const li = el("li"); li.append(card); cards.append(li);
    });
    panel.append(head, cards);
    tablist.append(tab); map.append(panel);
    return { state, tab, panel };
  });
  function select(state) {
    parts.forEach((p) => {
      const on = p.state === state;
      p.tab.setAttribute("aria-selected", String(on));
      p.tab.tabIndex = on ? 0 : -1;
      p.panel.classList.toggle("is-selected", on);
    });
  }
  // 탭 역할은 탭이 보일 때만 준다. 넓은 화면의 열은 머리 제목이 이름이다.
  function layout() {
    parts.forEach((p) => {
      if (narrow.matches) { p.panel.setAttribute("role", "tabpanel"); p.panel.setAttribute("aria-labelledby", p.tab.id); }
      else { p.panel.removeAttribute("role"); p.panel.setAttribute("aria-labelledby", `head-${p.state}`); }
    });
  }
  tablist.addEventListener("click", (event) => {
    const tab = event.target.closest("[role=tab]");
    if (tab) select(tab.id.slice(4));
  });
  tablist.addEventListener("keydown", (event) => {
    const at = parts.findIndex((p) => p.tab === event.target);
    const to = { ArrowRight: (at + 1) % parts.length, ArrowLeft: (at + parts.length - 1) % parts.length, Home: 0, End: parts.length - 1 }[event.key];
    if (at < 0 || to === undefined) return;
    event.preventDefault();
    select(parts[to].state);
    parts[to].tab.focus();
  });
  narrow.addEventListener("change", layout);
  select("doing");
  layout();
}
try {
  if (!projectId || projectId === "." || projectId === ".." || /[\\/]/.test(projectId)) throw new Error("주소 끝에 ?p=프로젝트이름을 붙여 주세요.");
  const response = await fetch(`${DATA}/board.json`, { cache: "no-store" });
  if (!response.ok) throw new Error(`board.json을 읽지 못했습니다. HTTP ${response.status}`);
  board = await response.json();
  validateBoard(board);
  document.getElementById("project").textContent = board.project || projectId;
  if (board.format === "task-board") renderTasks(); else renderLegacy();
  loadProduct().catch(() => {});
} catch (error) {
  map.replaceChildren();
  const message = el("p", "error", `보드를 읽지 못했습니다. ${error.message}`);
  message.setAttribute("role", "alert"); sheet.append(message);
}
</script>
</body>
