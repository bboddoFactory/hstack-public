<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css"><title>상태 전이도 · sample-shop 예시</title></head><body class="example"><p class="type">03 · 상태 전이도</p><h2>어떤 상태에서 무엇 때문에 바뀔까?</h2><p class="context">상태 전이도: 무엇이 어떤 상태에서 어떤 상태로 바뀌는지 보여 주는 그림. 주문과 배송의 상태가 어떻게 바뀌는지 확인하려고 골랐다.</p><div class="diagram" tabindex="0" role="region" aria-label="상태 전이도. 좁은 화면에서는 좌우로 이동할 수 있습니다."><svg viewBox="0 0 1000 620" role="img" aria-labelledby="title description"><title id="title">상태 전이도 · sample-shop 명세와 설계 예시</title><desc id="description">주문과 배송의 상태를 분리한 가상 설계 예시. 구현 전 예시입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect x="25" y="20" width="950" height="250" rx="12" class="region"/><text x="50" y="55" class="caption" text-anchor="start"><tspan x="50" dy="0">주문 상태</tspan></text><rect x="130" y="100" width="220" height="65" rx="10" class="node "/><text x="240.0" y="140.5" class="label" text-anchor="middle"><tspan x="240.0" dy="0">결제 대기</tspan></text><rect x="650" y="100" width="220" height="65" rx="10" class="node accent"/><text x="760.0" y="140.5" class="label" text-anchor="middle"><tspan x="760.0" dy="0">결제 완료</tspan></text><path d="M350 123H650" class="edge"/><text x="500" y="105" class="small" text-anchor="middle"><tspan x="500" dy="0">결제 승인</tspan></text><path d="M760 165V225H240V165" class="edge"/><text x="500" y="215" class="small" text-anchor="middle"><tspan x="500" dy="0">결제 취소 · 재주문</tspan></text><rect x="25" y="300" width="950" height="290" rx="12" class="region"/><text x="50" y="338" class="caption" text-anchor="start"><tspan x="50" dy="0">배송 상태 · 결제 완료 후 생성</tspan></text><rect x="85" y="385" width="200" height="65" rx="10" class="node "/><text x="185.0" y="425.5" class="label" text-anchor="middle"><tspan x="185.0" dy="0">배송 준비</tspan></text><path d="M285 417H400" class="edge"/><rect x="400" y="385" width="200" height="65" rx="10" class="node accent"/><text x="500.0" y="425.5" class="label" text-anchor="middle"><tspan x="500.0" dy="0">배송 중</tspan></text><path d="M600 417H715" class="edge"/><rect x="715" y="385" width="200" height="65" rx="10" class="node "/><text x="815.0" y="425.5" class="label" text-anchor="middle"><tspan x="815.0" dy="0">배송 완료</tspan></text><path d="M500 450V510" class="edge"/><text x="550" y="489" class="small" text-anchor="middle"><tspan x="550" dy="0">오류</tspan></text><rect x="400" y="510" width="200" height="55" rx="10" class="node note"/><text x="500.0" y="545.5" class="label" text-anchor="middle"><tspan x="500.0" dy="0">실패</tspan></text></svg></div><p class="insight">위쪽은 주문의 결제 상태이고 아래쪽은 배송 상태입니다. 배송 중 오류가 발생하면 실패 상태로 바뀝니다.</p></body></html>
