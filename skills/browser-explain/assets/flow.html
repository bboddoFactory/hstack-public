<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css"><title>흐름도 · sample-shop 예시</title></head><body class="example"><p class="type">01 · 흐름도</p><h2>어떤 순서로 진행하고, 어디서 갈라질까?</h2><p class="context">흐름도: 일이 어떤 순서로 진행되고 어디서 갈라지는지 보여 주는 그림. 쿠폰 유효성에 따른 다음 단계와 갈림길을 한눈에 확인하려고 골랐다.</p><div class="diagram" tabindex="0" role="region" aria-label="흐름도. 좁은 화면에서는 좌우로 이동할 수 있습니다."><svg viewBox="0 0 1000 570" role="img" aria-labelledby="title description"><title id="title">흐름도 · sample-shop 명세와 설계 예시</title><desc id="description">어떤 순서로 진행하고, 어디서 갈라질까? 구현 전 예시입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect x="350" y="30" width="300" height="64" rx="10" class="node "/><text x="500.0" y="70.0" class="label" text-anchor="middle"><tspan x="500.0" dy="0">장바구니를 연다</tspan></text><path d="M500 94V170" class="edge"/><text x="620" y="140" class="small" text-anchor="middle"><tspan x="620" dy="0">쿠폰 입력</tspan></text><rect x="350" y="170" width="300" height="80" rx="10" class="node accent"/><text x="500.0" y="204.0" class="label" text-anchor="middle"><tspan x="500.0" dy="0">쿠폰 확인</tspan><tspan x="500.0" dy="29">유효성 검사</tspan></text><path d="M650 210H790" class="edge"/><text x="720" y="190" class="small" text-anchor="middle"><tspan x="720" dy="0">유효하지 않음</tspan></text><rect x="790" y="178" width="180" height="64" rx="32" class="node "/><text x="880.0" y="218.0" class="label" text-anchor="middle"><tspan x="880.0" dy="0">오류 표시</tspan></text><path d="M500 250V330" class="edge"/><text x="620" y="300" class="small" text-anchor="middle"><tspan x="620" dy="0">유효함</tspan></text><rect x="350" y="330" width="300" height="64" rx="10" class="node "/><text x="500.0" y="370.0" class="label" text-anchor="middle"><tspan x="500.0" dy="0">할인 금액을 계산한다</tspan></text><path d="M500 394V470" class="edge"/><rect x="350" y="470" width="300" height="64" rx="32" class="node accent"/><text x="500.0" y="496.0" class="label" text-anchor="middle"><tspan x="500.0" dy="0">주문 금액에</tspan><tspan x="500.0" dy="29">할인을 반영한다</tspan></text></svg></div><p class="insight">유효한 쿠폰은 할인 금액을 주문에 반영합니다. 유효하지 않은 쿠폰은 오류를 표시하고 할인을 적용하지 않습니다.</p></body></html>
