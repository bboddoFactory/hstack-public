<!doctype html>
<!--
템플릿: 후보: 동작 차이. "후보마다 실행이 어떻게 갈리나"
안의 내용은 sample-shop의 가상 예시다. 그대로 쓰지 말고 data-slot 자리를 현재 질문의 내용으로 바꾼다.
그림(svg) 자리는 손으로 그린다.
-->

<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css"><title>쿠폰 적용 방식 후보 · sample-shop 예시</title>
<style>
.example{max-width:1120px;margin:auto}.legend{font-size:14px;color:var(--muted);margin-top:10px}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 12px;border:1.5px solid}
.frame{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:8 5}.tab{fill:var(--soft);stroke:var(--accent);stroke-width:1.5}.sep{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 5}
.guard{fill:var(--accent);font-weight:650}.edge.hl{stroke:var(--accent);stroke-width:2.6;marker-end:url(#arrowhl)}.good{fill:var(--soft);stroke:var(--accent)}
.diagram svg{min-width:900px}
</style></head>
<body class="example">
<!-- slot type: 프로젝트 · 작업 이름 -->
<p class="type" data-slot="type">sample-shop · 쿠폰 적용 후보</p>
<!-- slot title: 이 페이지가 답하는 질문 -->
<h1 data-slot="title">쿠폰 적용 방식 후보</h1>
<!-- slot context: 그림 이름·짧은 뜻·이 질문에 고른 이유 -->
<p class="context" data-slot="context">시퀀스 다이어그램: 참여자 사이의 요청 순서와 후보별 차이를 비교한다.</p>
<!-- slot legend: 색·선·상자의 뜻 -->
<p class="legend" data-slot="legend">파란 상자는 비교할 구성요소를 뜻한다.</p>
<!-- slot diagram: 후보를 포함한 sequence. 공통 메시지는 한 번, 갈리는 메시지만 "후보" 상자의 칸마다 후보 하나 -->
<div data-slot="diagram" class="diagram" tabindex="0" role="region" aria-label="후보를 포함한 시퀀스"><svg viewBox="0 0 1000 500" role="img" aria-label="후보별 쿠폰 적용 순서"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="var(--line)"/></marker></defs><rect x="40" y="20" width="180" height="55" rx="8" class="node"/><text x="130" y="55" class="small" text-anchor="middle">장바구니</text><rect x="410" y="20" width="180" height="55" rx="8" class="node accent"/><text x="500" y="55" class="small" text-anchor="middle">상점 서버</text><rect x="780" y="20" width="180" height="55" rx="8" class="node"/><text x="870" y="55" class="small" text-anchor="middle">쿠폰 서비스</text><path d="M130 75 V480 M500 75 V480 M870 75 V480" class="lifeline"/><path d="M130 120 H500" class="edge"/><text x="315" y="110" class="small" text-anchor="middle">쿠폰 적용 요청</text><rect x="250" y="150" width="710" height="235" class="region"/><text x="270" y="175" class="small">후보 A: 장바구니에서 확인</text><path d="M500 205 H870" class="edge"/><text x="685" y="195" class="small" text-anchor="middle">유효성 확인</text><path d="M870 245 H500" class="edge response"/><text x="685" y="235" class="small" text-anchor="middle">확인 결과</text><path d="M250 265 H960" class="divider"/><text x="270" y="290" class="small">후보 B: 결제할 때 확인</text><path d="M500 325 H870" class="edge"/><text x="685" y="315" class="small" text-anchor="middle">결제와 함께 확인</text><path d="M870 365 H500" class="edge response"/><text x="685" y="355" class="small" text-anchor="middle">확인 결과</text><path d="M500 430 H130" class="edge response"/><text x="315" y="420" class="small" text-anchor="middle">할인 결과</text></svg>
</div>
<!-- slot insight: 그림에서 볼 곳과 그 뜻 한두 문장 -->
<p class="insight" data-slot="insight">후보 A는 장바구니에서 쿠폰을 확인하고 후보 B는 결제할 때 확인합니다. 공통 요청과 응답 사이에서 확인 시점이 달라집니다.</p>
</body></html>
