<!doctype html>
<!--
템플릿: 후보: 변경 비용. "나중에 바꿀 때 무엇을 같이 고치나"
안의 내용은 sample-shop의 가상 예시다. 그대로 쓰지 말고 data-slot 자리를 현재 질문의 내용으로 바꾼다.
그림(svg) 자리는 손으로 그린다.
-->

<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><link rel="icon" href="data:,"><link rel="stylesheet" href="shared.css"><title>쿠폰 조건 변경 비용 · sample-shop 예시</title>
<style>
.example{max-width:1120px;margin:auto}.legend{font-size:14px;color:var(--muted);margin-top:10px}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin:0 4px 0 12px;border:1.5px solid}
.add{fill:var(--soft);stroke:var(--accent)}.addt{fill:var(--accent)!important;font-weight:650}.touch{fill:var(--note);stroke:var(--note-line)}.link{fill:none;stroke:var(--note-line);stroke-width:1.5;stroke-dasharray:4 4}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.diagram svg{min-width:900px}
</style></head>
<body class="example">
<!-- slot type: 프로젝트 · 작업 이름 -->
<p class="type" data-slot="type">sample-shop · 쿠폰 적용 후보</p>
<!-- slot title: 이 페이지가 답하는 질문 -->
<h1 data-slot="title">쿠폰 조건 변경 비용</h1>
<!-- slot context: 그림 이름·짧은 뜻·이 질문에 고른 이유 -->
<p class="context" data-slot="context">table 구조도: 쿠폰 조건이 바뀔 때 각 후보에서 함께 고칠 곳을 비교한다.</p>
<!-- slot legend: 색·선·상자의 뜻 -->
<p class="legend" data-slot="legend">파란 상자는 비교할 구성요소를 뜻한다.</p>
<!-- slot diagram: ERD(entity와 column만) 위에 흔히 생길 같은 변경 하나를 후보마다 얹고 같이 고칠 곳(migration, SQL)을 잇는다 -->
<div data-slot="diagram" class="diagram" tabindex="0" role="region" aria-label="후보별 변경 영향"><svg viewBox="0 0 1100 430" role="img" aria-label="쿠폰 조건 변경 비용"><text x="30" y="30" class="small">후보 A: 조건 한 곳</text><rect x="30" y="55" width="260" height="150" rx="8" class="node"/><text x="50" y="85" class="small">coupons</text><text x="50" y="120" class="small">id</text><text x="50" y="155" class="small">조건</text><rect x="340" y="75" width="180" height="90" rx="8" class="node note"/><text x="430" y="125" class="small" text-anchor="middle">조건 읽는 코드</text><path d="M290 120 H340" class="edge"/><path d="M550 20 V400" class="divider"/><text x="580" y="30" class="small">후보 B: 조건 복사</text><rect x="580" y="55" width="220" height="150" rx="8" class="node"/><text x="600" y="85" class="small">coupons</text><text x="600" y="120" class="small">id</text><text x="600" y="155" class="small">조건</text><rect x="580" y="235" width="220" height="150" rx="8" class="node"/><text x="600" y="265" class="small">orders</text><text x="600" y="300" class="small">id</text><text x="600" y="335" class="small">복사한 조건</text><rect x="860" y="135" width="200" height="100" rx="8" class="node note"/><text x="960" y="180" class="small" text-anchor="middle">두 곳을 갱신하는</text><text x="960" y="205" class="small" text-anchor="middle">코드</text><path d="M800 130 L860 165 M800 310 L860 215" class="edge"/></svg>
</div>
<!-- slot insight: 후보별 고칠 곳의 수와 그 뜻 한두 문장 -->
<p class="insight" data-slot="insight">후보 A는 쿠폰 조건 한 곳을 바꾸고 읽는 코드를 확인합니다. 후보 B는 주문에 복사한 조건도 함께 갱신해야 합니다.</p>
</body></html>
